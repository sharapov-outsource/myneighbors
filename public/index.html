<!DOCTYPE html>
<html lang="%LANG%" dir="%DIR%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <!-- Title and description come from the same dictionary the page uses, in the
       language the request asked for, so a crawler that runs no JavaScript sees
       what a visitor sees. -->
  <title>%TITLE%</title>
  <meta name="description" content="%DESCRIPTION%" id="meta-description">
  <!-- Only the home page is worth indexing; a report page is a check result. -->
  <meta name="robots" content="%ROBOTS%" id="meta-robots">
  <link rel="canonical" href="%URL%" id="link-canonical">

  <meta name="theme-color" content="#14110c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f9f4ea" media="(prefers-color-scheme: light)">
  <meta name="application-name" content="Neighbors Check">
  <meta name="apple-mobile-web-app-title" content="Neighbors Check">
  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Neighbors Check">
  <meta property="og:url" content="%URL%" id="og-url">
  <meta property="og:locale" content="%LOCALE%" id="og-locale">
  <meta property="og:title" content="%TITLE%" id="og-title">
  <meta property="og:description" content="%DESCRIPTION%" id="og-description">
  <meta property="og:image" content="%ORIGIN%/static/og-image.png" id="og-image">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Neighbors Check">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="%TITLE%" id="twitter-title">
  <meta name="twitter:description" content="%DESCRIPTION%" id="twitter-description">
  <meta name="twitter:image" content="%ORIGIN%/static/og-image.png" id="twitter-image">

  <link rel="stylesheet" href="/static/kit/base.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Neighbors Check",
    "url": "%ORIGIN%/",
    "applicationCategory": "SecurityApplication",
    "operatingSystem": "Any",
    "description": "%DESCRIPTION%",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "inLanguage": ["en", "ru", "es", "zh", "hi", "ar", "pt", "fr", "de", "ja", "tr", "uk"]
  }
  </script>
%ANALYTICS%
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <rect class="tile" width="1024" height="1024" rx="336"/>
          <!-- A block of addresses, the middle one the address you asked about. -->
          <rect class="glyph" x="200" y="200" width="168" height="168" rx="52"/>
          <rect class="glyph" x="428" y="200" width="168" height="168" rx="52"/>
          <rect class="glyph" x="656" y="200" width="168" height="168" rx="52"/>
          <rect class="glyph" x="200" y="428" width="168" height="168" rx="52"/>
          <rect class="accent" x="428" y="428" width="168" height="168" rx="52"/>
          <rect class="glyph" x="656" y="428" width="168" height="168" rx="52"/>
          <rect class="glyph" x="200" y="656" width="168" height="168" rx="52"/>
          <rect class="glyph" x="428" y="656" width="168" height="168" rx="52"/>
          <rect class="glyph" x="656" y="656" width="168" height="168" rx="52"/>
        </svg>
      </span>
      <div>
        <div class="wordmark">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1 data-i18n="h1">Neighbors Check</h1>
        </div>
        <div class="sub" data-i18n="subtitle"></div>
      </div>
    </div>
    <div class="tools">
      <select id="lang" aria-label="Language"></select>
      <button id="btn-rescan"><span class="mark" aria-hidden="true">↻</span><span data-i18n="btn_rescan"></span></button>
      <button id="btn-copy-json"><span class="mark" aria-hidden="true">⧉</span><span data-i18n="btn_copy_json"></span></button>
      <button id="btn-save-json"><span class="mark" aria-hidden="true">↓</span><span data-i18n="btn_save_json"></span></button>
      <a class="ghlink" href="https://github.com/sharapov-outsource/myneighbors"
         target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GitHub
      </a>
    </div>
  </header>

  <form class="search" id="search-form">
    <input id="search-host" type="text" inputmode="url" spellcheck="false" autocomplete="off"
           placeholder="8.8.8.8" aria-label="IP address">
    <button type="submit" class="primary" id="btn-scan"><span data-i18n="btn_scan"></span></button>
  </form>

  <section class="hero" id="hero">
    <div class="hero-grade">
      <div class="grade-badge pending" id="count-badge">·</div>
      <div class="grade-caption" data-i18n="hero_count"></div>
    </div>
    <div class="hero-main">
      <div class="hero-label" data-i18n="hero_label"></div>
      <div class="host-line">
        <span class="host" id="hero-host">…</span>
      </div>
      <div class="hero-meta" id="hero-meta"></div>
      <div class="progress" id="progress" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label"></div>
      </div>
    </div>
  </section>

  <div id="alerts"></div>

  <main class="grid" id="report" hidden>

    <section class="card">
      <h2><span data-i18n="card_address"></span></h2>
      <div class="row"><span class="k" data-i18n="k_names_here"></span><span class="v skeleton big" id="a-count"></span></div>
      <div class="row"><span class="k" data-i18n="k_shared"></span><span class="v skeleton" id="a-shared"></span></div>
      <div class="row"><span class="k" data-i18n="k_ptr"></span><span class="v skeleton" id="a-ptr"></span></div>
      <div class="row"><span class="k" data-i18n="k_cert_subject"></span><span class="v skeleton" id="a-subject"></span></div>
      <div class="row"><span class="k" data-i18n="k_cert_issuer"></span><span class="v skeleton" id="a-issuer"></span></div>
      <div class="row"><span class="k" data-i18n="k_server"></span><span class="v skeleton" id="a-server"></span></div>
      <div class="note" data-i18n="note_address"></div>
    </section>

    <section class="card">
      <h2><span data-i18n="card_block"></span></h2>
      <div class="row"><span class="k" data-i18n="k_block"></span><span class="v skeleton big" id="b-cidr"></span></div>
      <div class="row"><span class="k" data-i18n="k_block_source"></span><span class="v skeleton" id="b-source"></span></div>
      <div class="row"><span class="k" data-i18n="k_range"></span><span class="v skeleton" id="b-range"></span></div>
      <div class="row"><span class="k" data-i18n="k_swept"></span><span class="v skeleton" id="b-swept"></span></div>
      <div class="row"><span class="k" data-i18n="k_with_ptr"></span><span class="v skeleton" id="b-ptr"></span></div>
      <div class="row"><span class="k" data-i18n="k_responded"></span><span class="v skeleton" id="b-responded"></span></div>
      <div class="note" data-i18n="note_block"></div>
    </section>

    <section class="card">
      <h2><span data-i18n="card_registry"></span></h2>
      <div class="row"><span class="k" data-i18n="k_net_name"></span><span class="v skeleton big" id="r-name"></span></div>
      <div class="row"><span class="k" data-i18n="k_holder"></span><span class="v skeleton" id="r-holder"></span></div>
      <div class="row"><span class="k" data-i18n="k_net_range"></span><span class="v skeleton" id="r-range"></span></div>
      <div class="row"><span class="k" data-i18n="k_country"></span><span class="v skeleton" id="r-country"></span></div>
      <div class="row"><span class="k" data-i18n="k_rir"></span><span class="v skeleton" id="r-rir"></span></div>
      <div class="row"><span class="k" data-i18n="k_registered"></span><span class="v skeleton" id="r-registered"></span></div>
      <div class="row"><span class="k" data-i18n="k_abuse"></span><span class="v skeleton" id="r-abuse"></span></div>
    </section>

    <section class="card">
      <h2><span data-i18n="card_routing"></span></h2>
      <div class="row"><span class="k" data-i18n="k_asn"></span><span class="v skeleton big" id="g-asn"></span></div>
      <div class="row"><span class="k" data-i18n="k_as_name"></span><span class="v skeleton" id="g-name"></span></div>
      <div class="row"><span class="k" data-i18n="k_routed_prefix"></span><span class="v skeleton" id="g-prefix"></span></div>
      <div class="row"><span class="k" data-i18n="k_country"></span><span class="v skeleton" id="g-country"></span></div>
      <div class="row"><span class="k" data-i18n="k_allocated"></span><span class="v skeleton" id="g-allocated"></span></div>
      <div class="note" data-i18n="note_routing"></div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_here"></span></h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_name"></th>
            <th data-i18n="th_sources"></th>
            <th data-i18n="th_status"></th>
          </tr></thead>
          <tbody id="here-body"></tbody>
        </table>
      </div>
      <div class="note" data-i18n="note_here"></div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_neighbors"></span></h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_address"></th>
            <th data-i18n="th_ptr"></th>
            <th data-i18n="th_names"></th>
            <th data-i18n="th_server"></th>
          </tr></thead>
          <tbody id="neighbor-body"></tbody>
        </table>
      </div>
      <div class="note" data-i18n="note_neighbors"></div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_candidates"></span></h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_block"></th>
            <th data-i18n="th_source"></th>
            <th data-i18n="th_size"></th>
            <th data-i18n="th_holder"></th>
          </tr></thead>
          <tbody id="candidate-body"></tbody>
        </table>
      </div>
      <div class="note" data-i18n="note_candidates"></div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_unconfirmed"></span></h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th data-i18n="th_name"></th>
            <th data-i18n="th_sources"></th>
            <th data-i18n="th_status"></th>
            <th data-i18n="th_points_at"></th>
          </tr></thead>
          <tbody id="unconfirmed-body"></tbody>
        </table>
      </div>
      <div class="note" data-i18n="note_unconfirmed"></div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_flags"></span></h2>
      <div id="flag-list" class="findings"></div>
      <div class="note" data-i18n="note_flags"></div>
    </section>

    <section class="card wide">
      <h2><span data-i18n="card_raw"></span></h2>
      <pre class="raw" id="raw-json">…</pre>
    </section>

  </main>

  <section class="empty" id="empty">
    <p data-i18n="empty_hint"></p>
    <div class="examples-label" data-i18n="empty_examples"></div>
    <div class="examples" id="examples"></div>
  </section>

  <footer>
    %SERVICES%
    <p id="api-hint"></p>
    <p><span data-i18n="footer1"></span><br><span data-i18n="footer2"></span><br><span data-i18n="footer3"></span></p>
    <a class="footer-credit" href="https://sharapov.biz"
       target="_blank" rel="noopener noreferrer" aria-label="Sharapov">
      <img src="/static/kit/sharapov.svg" alt="Sharapov" width="72" height="16">
    </a>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/kit/i18n-common.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
